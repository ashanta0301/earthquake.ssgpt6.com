name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate site files
        run: |
          test -f index.html
          test -f about.html
          test -f resources.html
          test -f contact.html
          test -f style.css
          test -f app.js
          node --check app.js
          echo "✓ Static site files validated"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: earthquake.ssgpt6.com

      - name: Deployment Status
        run: echo "✅ Website deployed successfully!"
